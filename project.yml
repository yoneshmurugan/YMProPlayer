name: YM Pro
options:
  bundleIdPrefix: com.ytsplayer
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  GRDB:
    path: GRDB

targets:
  YM Pro:
    type: application
    platform: macOS
    sources:
      - path: ytsplayer
        excludes:
          - "**/*.md"
          - "**/*.dSYM"
    info:
      path: ytsplayer/App/Info.plist
      properties:
        CFBundleName: "YM Pro"
        CFBundleDisplayName: "YM Pro"
        CFBundleIconFile: AppIcon
        CFBundleIdentifier: com.yonesh.ympro.mac
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSHumanReadableCopyright: ""
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSRequiresAquaSystemAppearance: false
        LSMinimumSystemVersion: "13.0"
        NSMicrophoneUsageDescription: "ytsplayer requires audio device access for bit-perfect playback."
        LSApplicationCategoryType: "public.app-category.music"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "com.ytsplayer.track.id"
            UTTypeDescription: "Track ID"
            UTTypeConformsTo:
              - "public.text"
    settings:
      base:
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: ytsplayer/App/ytsplayer-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - /opt/homebrew/include
          - ytsplayer/Engine
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - ytsplayer/Dependencies
        OTHER_CFLAGS:
          - "$(inherited)"
          - -I/opt/homebrew/include
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GCC_C_LANGUAGE_STANDARD: c11
        SWIFT_VERSION: "5"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.yonesh.ympro.mac
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_OPTIMIZATION_LEVEL: -O
        GCC_OPTIMIZATION_LEVEL: "3"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: "YM Pro"
      debug:
        SWIFT_OPTIMIZATION_LEVEL: -Onone
        GCC_OPTIMIZATION_LEVEL: "0"
        DEBUG_INFORMATION_FORMAT: dwarf
    entitlements:
      path: ytsplayer/ytsplayer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.yonesh.ympro.mac
    dependencies:
      - package: GRDB
      - target: YM Pro Widget
        embed: true
      - framework: ytsplayer/Dependencies/libFLAC.dylib
        embed: true
        codeSign: true
      - framework: ytsplayer/Dependencies/libtag.dylib
        embed: true
        codeSign: true
      - framework: ytsplayer/Dependencies/libogg.0.dylib
        embed: true
        codeSign: true
    postBuildScripts:
      - name: "Copy Framework dSYMs to Archive"
        script: |
          if [ -n "${DWARF_DSYM_FOLDER_PATH}" ] && [ "${DWARF_DSYM_FOLDER_PATH}" != "/" ]; then
            mkdir -p "${DWARF_DSYM_FOLDER_PATH}"
            cp -R "${SRCROOT}/ytsplayer/Dependencies/libFLAC.dylib.dSYM" "${DWARF_DSYM_FOLDER_PATH}/"
            cp -R "${SRCROOT}/ytsplayer/Dependencies/libtag.dylib.dSYM" "${DWARF_DSYM_FOLDER_PATH}/"
            cp -R "${SRCROOT}/ytsplayer/Dependencies/libogg.0.dylib.dSYM" "${DWARF_DSYM_FOLDER_PATH}/"
          fi
    scheme:
      testTargets:
        - YM ProTests
        
  YM Pro Widget:
    type: app-extension
    platform: macOS
    sources:
      - path: ytsplayerWidget
    info:
      path: ytsplayerWidget/Info.plist
      properties:
        CFBundleName: "YM Pro Widget"
        CFBundleDisplayName: "YM Pro Widget"
        CFBundleIdentifier: com.yonesh.ympro.mac.widget
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        ARCHS: arm64
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        PRODUCT_BUNDLE_IDENTIFIER: com.yonesh.ympro.mac.widget
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ytsplayerWidget/ytsplayerWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.yonesh.ympro.mac
        
  YM ProTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ytsplayerTests
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - /opt/homebrew/include
          - ytsplayer/Engine
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: YM Pro
